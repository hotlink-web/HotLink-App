<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HotLink LIVE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#FE2C55;--cyan:#25F4EE;--glass:rgba(0,0,0,.36);--txt:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--txt);font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:440px;height:100%;overflow:hidden;background:linear-gradient(160deg,#2b1055,#7597de 55%,#d66d75)}
.app:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.18),transparent 55%),linear-gradient(to bottom,rgba(0,0,0,.35),transparent 22%,transparent 50%,rgba(0,0,0,.7))}
.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:3}
.host{display:flex;align-items:center;background:var(--glass);border-radius:999px;padding:3px 4px 3px 3px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffdd55,#ff4d6d);border:2px solid var(--red);flex:none;display:grid;place-items:center;font-weight:700}
.hinfo{padding:0 8px;min-width:0;line-height:1.2}
.hname{font-size:13px;font-weight:700;max-width:92px;overflow:hidden;text-overflow:ellipsis}
.hlikes{font-size:11px;opacity:.85}
.follow{background:var(--red);border:0;color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:8px 14px}
.right{display:flex;align-items:center;gap:6px}
.count{background:var(--glass);border-radius:999px;height:28px;padding:0 9px;font-size:12px;font-weight:700;display:grid;place-items:center}
.x{width:28px;height:28px;display:grid;place-items:center;font-size:20px;color:#fff;background:none;border:0}
.sub{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:3;gap:8px}
.pill{background:var(--glass);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:600}
.live{background:linear-gradient(90deg,var(--red),#ff5b8a);padding:3px 8px;border-radius:5px;font-size:11px}
.pinned{position:absolute;left:10px;right:70px;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:3;background:rgba(0,0,0,.4);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35}
.pinned b{color:var(--cyan)}
.chat{position:absolute;left:0;bottom:calc(env(safe-area-inset-bottom,0px) + 68px);width:82%;max-height:36%;padding:0 10px;overflow:auto;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
.msg{font-size:13.5px;line-height:1.35;background:rgba(0,0,0,.28);padding:6px 10px;border-radius:14px;overflow-wrap:anywhere}
.msg .u{color:rgba(255,255,255,.75);font-weight:600;margin-right:5px}
.bar{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;align-items:center;gap:8px;z-index:4}
.input{flex:1;min-width:0;background:rgba(0,0,0,.38);border:0;color:#fff;font:inherit;font-size:14px;border-radius:999px;padding:11px 16px;outline:none}
.input::placeholder{color:rgba(255,255,255,.75)}
.ib{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.38);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;font-size:20px}
.ib.gift{color:#ffd23f}.ib.heart{color:var(--red)}
.status{position:absolute;left:10px;right:10px;bottom:72px;z-index:5;font-size:12px;color:#fff;background:rgba(0,0,0,.7);border-radius:10px;padding:8px;display:none}
.status.show{display:block}
#countdownOverlay{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);font-size:clamp(100px,35vw,180px);font-weight:900;color:#fff;text-shadow:0 5px 25px rgba(0,0,0,.8)}
#countdownOverlay.show{display:flex}
#countdownOverlay.pop{animation:countPop .75s ease both}
@keyframes countPop{0%{transform:scale(1.7);opacity:0}35%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.85);opacity:0}}
#cameraPreview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;display:none;background:#000}
.top,.sub,.pinned,.chat,.bar{z-index:3}
.top{z-index:8}
.powerBtn{width:36px;height:36px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:18px;display:none;place-items:center;cursor:pointer}
.cameraBtn{position:absolute;right:12px;bottom:115px;z-index:4;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:19px;display:grid;place-items:center}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#121212;border-radius:16px 16px 0 0;z-index:6;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateY(105%);transition:transform .3s ease}
.sheet.open{transform:none}
.scrim{position:absolute;inset:0;z-index:5;display:none;background:rgba(0,0,0,.25)}
.scrim.open{display:block}
.sheet button{background:var(--red);border:0;color:white;font-weight:700;border-radius:999px;padding:10px 18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="host">
      <div class="avatar">H</div>
      <div class="hinfo"><div class="hname" id="hostName">HotLink LIVE</div><div class="hlikes">♥ <span id="likes">—</span></div></div>
      <button class="follow" id="follow">Follow</button>
    </div>
    <div class="right">
      <div class="count" id="count">— viewers</div>
      <button class="powerBtn" id="powerBtn" aria-label="End LIVE" title="End LIVE"><i class="fa-solid fa-power-off"></i></button>
<button class="x" id="closeBtn" aria-label="Close">✕</button>
    </div>
  </div>

  <div class="sub">
    <div class="pill"><span class="live">● LIVE</span> <span id="time">Waiting for stream</span></div>
    <div class="pill" id="rank">HotLink</div>
  </div>

  <div id="startPanel" style="position:absolute;z-index:4;top:155px;left:12px;right:12px;background:rgba(0,0,0,.82);padding:14px;border-radius:14px">
    <label for="liveTitle" style="display:block;font-size:14px;margin-bottom:8px">Start your LIVE</label>
    <input id="liveTitle" maxlength="100" placeholder="Enter a LIVE title" style="width:100%;padding:11px;border:0;border-radius:8px;margin-bottom:10px">
    <button id="startLiveBtn" style="width:100%;padding:12px;border:0;border-radius:999px;background:#FE2C55;color:white;font-weight:bold">Start LIVE</button>
  </div>
  <div id="countdownOverlay" aria-live="assertive"></div>
  <video id="cameraPreview" autoplay playsinline muted></video>
  <button class="cameraBtn" id="cameraBtn" aria-label="Start camera" title="Camera"><i class="fa-solid fa-video"></i></button>
  <div class="pinned"><b>LIVE</b> Welcome. Only real stream activity will be displayed.</div>
  <div class="chat" id="chat" aria-live="polite">
    <div class="msg">Connecting to HotLink live services…</div>
  </div>
  <div class="status" id="status" role="status"></div>

  <div class="bar">
    <input class="input" id="inp" placeholder="Say something…" maxlength="150" aria-label="Comment">
    <button class="ib" id="shopBtn" aria-label="Shop">▣</button>
    <button class="ib gift" id="giftBtn" aria-label="Gifts">♔</button>
    <button class="ib" id="shareBtn" aria-label="Share">↗</button>
    <button class="ib heart" id="heartBtn" aria-label="Like">♥</button>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Gifts">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <strong>Gifts</strong><span>Balance: unavailable</span>
    </div>
    <p style="font-size:13px;color:#ddd;margin-bottom:14px">Gift sending is not enabled. No coins or gifts have been charged or sent.</p>
    <button id="closeSheet">Close</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const chat = $('chat');
  let socket = null;
  let roomId = null;
  let connected = false;

  let cameraStream = null;
  let lastTapAt = 0;

  async function toggleCamera(){
    const video = $('cameraPreview');
    if(cameraStream){
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
      video.srcObject = null;
      video.style.display = 'none';
      $('cameraBtn').innerHTML = '<i class="fa-solid fa-video"></i>';
      $('cameraBtn').setAttribute('aria-label','Start camera');
      status('Camera stopped.');
      return;
    }
    try {
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
        throw new Error('Camera requires HTTPS or localhost and a supported browser.');
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'user'}, width:{ideal:1280}, height:{ideal:720}, aspectRatio:{ideal:16/9}}, audio:false
      });
      video.srcObject = cameraStream;
      video.style.display = 'block';
      await video.play();
      $('cameraBtn').innerHTML = '<i class="fa-solid fa-video-slash"></i>';
      $('cameraBtn').setAttribute('aria-label','Stop camera');
      status('Camera preview is on. It is not yet being broadcast to viewers.');
    } catch(e) {
      if(cameraStream) cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
      $('cameraBtn').innerHTML = '<i class="fa-solid fa-video"></i>';
      $('cameraBtn').setAttribute('aria-label','Start camera');
      status('Camera failed: ' + (e.message || 'Check browser camera permissions.'));
      console.error('Camera error:', e);
    }
  }

  $('cameraBtn').addEventListener('click', toggleCamera);

  $('app').addEventListener('touchend', function(e){
    if(e.target.closest('button,input,.sheet,.status')) return;
    const now = Date.now();
    if(now - lastTapAt < 320){
      e.preventDefault();
      sendLike();
      lastTapAt = 0;
    } else {
      lastTapAt = now;
    }
  }, {passive:false});

  $('app').addEventListener('dblclick', function(e){
    if(e.target.closest('button,input,.sheet,.status')) return;
    sendLike();
  });

  function sendLike(){
    if(!connected || !socket || !roomId){
      status('Join a LIVE room before liking.');
      return;
    }
    socket.emit('live_like', {room_id:roomId});
    status('Like sent.');
  }


  function status(message){
    const el = $('status');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(status.timer);
    status.timer = setTimeout(() => el.classList.remove('show'), 4000);
  }

  function addMessage(username, message){
    const row = document.createElement('div');
    row.className = 'msg';
    const user = document.createElement('span');
    user.className = 'u';
    user.textContent = username + ': ';
    const text = document.createElement('span');
    text.textContent = message;
    row.append(user, text);
    chat.appendChild(row);
    while(chat.children.length > 30) chat.removeChild(chat.firstChild);
    chat.scrollTop = chat.scrollHeight;
  }


  async function runStartCountdown(){
    const overlay = $('countdownOverlay');
    overlay.style.display = 'flex';

    for (const number of [3, 2, 1]) {
      overlay.textContent = number;
      overlay.classList.remove('pop');
      void overlay.offsetWidth;
      overlay.classList.add('pop');
      await new Promise(resolve => setTimeout(resolve, 800));
    }

    overlay.classList.remove('pop');
    overlay.style.display = 'none';
    overlay.textContent = '';
  }

  let isHost = false;
  let creatingLive = false;

  async function startLive(){
    if(creatingLive) return;
    const title = $('liveTitle').value.trim();
    if(!title) return status('Enter a title for your LIVE.');
    creatingLive = true;
    $('startLiveBtn').disabled = true;
    try {
      await runStartCountdown();
      const response = await fetch('/api/live/start', {
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({title})
      });
      const data = await response.json();
      if(!response.ok) throw new Error(data.error || 'Could not start LIVE');
      roomId = data.room_id;
      if(!roomId) throw new Error('Server did not return a room ID');
      isHost = true;
      $('rank').textContent = data.title || title;
      $('hostName').textContent = 'You';
      $('time').textContent = 'Room created';
      $('count').textContent = '0 viewers';
      $('startPanel').style.display = 'none';
      $('powerBtn').style.display = 'grid';
      $('cameraBtn').style.display = 'grid';
      $('time').textContent = data.already_live ? 'Resuming LIVE room' : 'Starting camera…';
      chat.innerHTML = '';
      addMessage('HotLink', data.already_live
        ? 'Reconnecting to your existing LIVE room…'
        : 'LIVE room created. Connecting host…');

      // Start the local camera preview after creating the room.
      try {
        if (!cameraStream) await toggleCamera();
      } catch (cameraError) {
        console.error('Camera start error:', cameraError);
      }

      if(typeof io !== 'function') throw new Error('Socket.IO client unavailable');
      if(socket) socket.disconnect();
      socket = io({transports:['websocket','polling']});
      socket.on('connect', () => {
        connected = true;
        socket.emit('join_live', {room_id:roomId});
      });
      socket.on('joined_live', data => {
        if(!data || Number(data.room_id) !== Number(roomId)) return;
        if(isHost) socket.emit('register_live_host', {room_id:roomId});
        $('time').textContent = 'LIVE room ready';
        addMessage('HotLink', 'You are connected to your LIVE room.');
      });
      socket.on('live_host_ready', data => {
        if(data && Number(data.room_id) === Number(roomId))
          status('Host registered. Camera broadcasting is not connected yet.');
      });
      socket.on('live_error', data => status(data && data.error || 'Live connection error'));
      socket.on('viewer_count', data => {
        if(data && Number(data.room_id) === Number(roomId))
          $('count').textContent = Number(data.count) + ' viewers';
      });
      socket.on('live_message', data => {
        if(data) addMessage(data.username || 'User', data.message || data.body || '');
      });
      socket.on('disconnect', () => { connected = false; });
      socket.on('connect_error', err => {
        console.error('Socket connection error:', err);
        status('Room created, but Socket.IO connection failed.');
      });
    } catch(e) {
      status(e.message || 'Could not start LIVE');
      console.error('Start LIVE error:', e);
    } finally {
      creatingLive = false;
      $('startLiveBtn').disabled = false;
    }
  }

  async function endLive(){
    if(!roomId || !isHost) return status('No LIVE room owned by this session.');
    $('powerBtn').disabled = true;
    try {
      const response = await fetch('/api/live/' + encodeURIComponent(roomId) + '/end', {
        method:'POST', credentials:'same-origin'
      });
      const data = await response.json();
      if(!response.ok) throw new Error(data.error || 'Could not end LIVE');
      if(socket) {
        socket.emit('leave_live', {room_id:roomId});
        socket.disconnect();
      }
      connected = false;
      isHost = false;
      roomId = null;
      $('startPanel').style.display = 'block';
      $('startLiveBtn').style.display = 'block';
      $('liveTitle').style.display = 'block';
      $('powerBtn').style.display = 'none';
      $('time').textContent = 'LIVE ended';
      $('count').textContent = '— viewers';
      addMessage('HotLink', 'Your LIVE room has ended.');
      status('LIVE ended.');
    } catch(e) {
      status(e.message || 'Could not end LIVE');
    } finally {
      $('powerBtn').disabled = false;
    }
  }

  $('startLiveBtn').addEventListener('click', startLive);
  $('powerBtn').addEventListener('click', () => {
    if(confirm('End your LIVE now?')) endLive();
  });

  async function loadRooms(){
    try {
      const response = await fetch('/api/live/rooms', {credentials:'same-origin'});
      if(!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      const rooms = Array.isArray(data) ? data : (data.rooms || []);
      if(!rooms.length){
        chat.innerHTML = '';
        addMessage('HotLink', 'No active LIVE rooms are available.');
        return;
      }
      const room = rooms[0];
      roomId = room.id || room.room_id;
      if(room.title) $('rank').textContent = room.title;
      if(room.host_name) $('hostName').textContent = room.host_name;
      if(!roomId) throw new Error('Room data did not include a room ID');
      connectRoom();
      loadMessages();
    } catch(e) {
      status('Could not load live rooms. Sign in and check the server.');
      console.error('Live rooms error:', e);
    }
  }

  async function loadMessages(){
    if(!roomId) return;
    try {
      const response = await fetch('/api/live/' + encodeURIComponent(roomId) + '/messages', {credentials:'same-origin'});
      if(!response.ok) return;
      const data = await response.json();
      const messages = Array.isArray(data) ? data : (data.messages || []);
      chat.innerHTML = '';
      if(!messages.length) addMessage('HotLink', 'No messages yet.');
      messages.forEach(m => addMessage(m.username || m.user_name || 'User', m.message || m.text || ''));
    } catch(e) {
      console.error('Live messages error:', e);
    }
  }

  function connectRoom(){
    if(!roomId || typeof io !== 'function') {
      status('Live connection is unavailable. Check internet access and Socket.IO client.');
      return;
    }
    socket = io({transports:['websocket','polling']});
    socket.on('connect', () => {
      connected = true;
      socket.emit('join_live', {room_id: roomId});
    });
    socket.on('disconnect', () => { connected = false; });
    socket.on('connect_error', err => {
      console.error('Socket connection error:', err);
      status('Live connection failed. Check server logs.');
    });
    socket.on('live_message', data => {
      if(data) addMessage(data.username || data.user_name || 'User', data.message || data.text || '');
    });
    socket.on('viewer_count', data => {
      if(data && Number.isFinite(Number(data.count))) $('count').textContent = Number(data.count) + ' viewers';
    });
    socket.on('live_like', () => {});
    socket.on('viewer_joined', () => {});
  }

  $('inp').addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || !this.value.trim()) return;
    if(!connected || !socket || !roomId){
      status('Not connected. Your message was not sent.');
      return;
    }
    socket.emit('live_message', {room_id: roomId, message: this.value.trim()});
    this.value = '';
  });

  $('follow').addEventListener('click', () => status('Follow is not connected to a real follow endpoint yet.'));
  $('heartBtn').addEventListener('click', sendLike);

  function openSheet(open){
    $('sheet').classList.toggle('open', open);
    $('scrim').classList.toggle('open', open);
  }
  $('giftBtn').addEventListener('click', () => openSheet(true));
  $('scrim').addEventListener('click', () => openSheet(false));
  $('closeSheet').addEventListener('click', () => openSheet(false));
  $('shopBtn').addEventListener('click', () => status('Shop is not connected.'));
  $('shareBtn').addEventListener('click', async () => {
    try {
      if(navigator.share) await navigator.share({title:'HotLink LIVE', url:location.href});
      else { await navigator.clipboard.writeText(location.href); status('Stream link copied.'); }
    } catch(e) {
      if(e.name !== 'AbortError') status('Could not share the stream link.');
    }
  });
  $('closeBtn').addEventListener('click', () => {
    if(history.length > 1) history.back();
    else location.href = '/';
  });

  window.addEventListener('pagehide', () => {
    if(cameraStream) cameraStream.getTracks().forEach(track => track.stop());
  });

  loadRooms();
})();
</script>
</body>
</html>
